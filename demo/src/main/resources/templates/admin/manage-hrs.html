<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Manage HRs — Admin')}"></head>
<body>

<!-- Navbar -->
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container py-5">

    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
        <div>
            <h3 class="fw-bold mb-0">Employer & Recruiter Verification</h3>
            <p class="text-muted small mb-0">Manage employer access, verify company details, and control posting privileges</p>
        </div>
        <a th:href="@{/admin/dashboard}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Back to Dashboard
        </a>
    </div>

    <!-- Alert -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${success}">Success</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- HR Table -->
    <div class="card border-0 shadow-sm rounded-4 p-4">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Company Name</th>
                        <th>HR Name</th>
                        <th>Email</th>
                        <th>Mobile</th>
                        <th>Status</th>
                        <th class="text-end">Verification Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="hr : ${hrs}">
                        <td>
                            <strong class="text-dark" th:text="${hr.companyName}">TechCorp</strong>
                        </td>
                        <td th:text="${hr.hrName}">Sarah Jenkins</td>
                        <td th:text="${hr.user.email}">recruiter@techcorp.com</td>
                        <td th:text="${hr.mobile}">+91 9876543210</td>
                        <td>
                            <span th:if="${hr.approvalStatus.name() == 'APPROVED'}" class="badge bg-success">
                                <i class="bi bi-check-circle me-1"></i>Approved
                            </span>
                            <span th:if="${hr.approvalStatus.name() == 'PENDING'}" class="badge bg-warning text-dark">
                                <i class="bi bi-clock-history me-1"></i>Pending
                            </span>
                            <span th:if="${hr.approvalStatus.name() == 'REJECTED'}" class="badge bg-danger">
                                <i class="bi bi-x-circle me-1"></i>Rejected
                            </span>
                        </td>
                        <td class="text-end">
                            <div class="d-inline-flex gap-2">
                                <!-- Approve Button -->
                                <form th:if="${hr.approvalStatus.name() != 'APPROVED'}" 
                                      th:action="@{'/admin/hrs/' + ${hr.id} + '/status'}" method="post">
                                    <input type="hidden" name="status" value="APPROVED">
                                    <button type="submit" class="btn btn-sm btn-success fw-semibold">
                                        <i class="bi bi-check-circle me-1"></i>Approve
                                    </button>
                                </form>

                                <!-- Reject Button -->
                                <form th:if="${hr.approvalStatus.name() != 'REJECTED'}" 
                                      th:action="@{'/admin/hrs/' + ${hr.id} + '/status'}" method="post">
                                    <input type="hidden" name="status" value="REJECTED">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">
                                        <i class="bi bi-x-circle me-1"></i>Reject
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
