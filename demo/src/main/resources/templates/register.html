<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: head('Register — CareerLink')}"></head>
<body>

<!-- Navbar -->
<nav th:replace="~{fragments/header :: navbar}"></nav>

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-sm border-0 rounded-4 p-4">
                <div class="text-center mb-4">
                    <div class="mb-2 text-primary" style="font-size: 2.5rem;">
                        <i class="bi bi-person-badge"></i>
                    </div>
                    <h3 class="fw-bold">Create Your Account</h3>
                    <p class="text-muted small">Join CareerLink as a Candidate or Employer</p>
                </div>

                <!-- Error Alert -->
                <div th:if="${error}" class="alert alert-danger py-2 small" th:text="${error}"></div>
                <!-- Success Alert -->
                <div th:if="${success}" class="alert alert-success py-2 small" th:text="${success}"></div>

                <form th:action="@{/register}" method="post" id="registerForm">

                    <!-- Role Selector -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">I want to:</label>
                        <div class="row g-2">
                            <div class="col-6">
                                <input type="radio" class="btn-check" name="role" id="roleCandidate" value="ROLE_CANDIDATE" checked onchange="toggleRoleFields()">
                                <label class="btn btn-outline-primary w-100 py-2" for="roleCandidate">
                                    <i class="bi bi-person-workspace d-block fs-5 mb-1"></i>Find a Job
                                </label>
                            </div>
                            <div class="col-6">
                                <input type="radio" class="btn-check" name="role" id="roleHr" value="ROLE_HR" onchange="toggleRoleFields()">
                                <label class="btn btn-outline-primary w-100 py-2" for="roleHr">
                                    <i class="bi bi-building d-block fs-5 mb-1"></i>Hire Talent
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Common Fields -->
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control" placeholder="name@example.com" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Mobile Number</label>
                        <input type="tel" name="mobile" class="form-control" placeholder="9876543210" required>
                    </div>

                    <!-- Candidate-Only Fields -->
                    <div id="candidateFields">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Full Name</label>
                            <input type="text" name="candidateName" class="form-control" placeholder="e.g. John Doe">
                        </div>
                    </div>

                    <!-- HR-Only Fields -->
                    <div id="hrFields" style="display: none;">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Company Name</label>
                            <input type="text" name="companyName" class="form-control" placeholder="e.g. Acme Technologies">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-semibold">HR / Contact Person Name</label>
                            <input type="text" name="hrName" class="form-control" placeholder="e.g. Sarah Connor">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-2">
                        Create Account
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="small text-muted mb-0">Already have an account? 
                        <a th:href="@{/login}" class="text-decoration-none fw-semibold">Log in here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
function toggleRoleFields() {
    const isCandidate = document.getElementById('roleCandidate').checked;
    document.getElementById('candidateFields').style.display = isCandidate ? 'block' : 'none';
    document.getElementById('hrFields').style.display = isCandidate ? 'none' : 'block';
}
</script>

</body>
</html>
