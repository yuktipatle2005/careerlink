<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Career Link — Job Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Bootstrap 5 JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        :root {
            --primary-color: #2563eb;
            --secondary-color: #0ea5e9;
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-brand {
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--primary-color) !important;
        }
        .navbar-brand i {
            color: var(--secondary-color);
        }
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        .btn-primary:hover {
            background-color: #1d4ed8;
            border-color: #1d4ed8;
        }
        .hero-banner {
            background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%);
            color: white;
            padding: 60px 0;
            border-radius: 0 0 30px 30px;
        }
        .job-card {
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
        }
        .job-card:hover {
            border-color: #93c5fd;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.1);
        }
    </style>
</head>
<body>

<!-- Navbar Fragment -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
        <a class="navbar-brand fs-4" th:href="@{/}">
            <i class="bi bi-briefcase-fill me-2"></i>CareerLink
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link active fw-semibold" th:href="@{/}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/#jobs-section}">Find Jobs</a>
                </li>
            </ul>
            <!-- Anonymous Users (Not Logged In) -->
            <div class="d-flex gap-2" sec:authorize="isAnonymous()">
                <a th:href="@{/login}" class="btn btn-outline-primary px-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Login
                </a>
                <a th:href="@{/register}" class="btn btn-primary px-3">
                    <i class="bi bi-person-plus-fill me-1"></i>Sign Up
                </a>
            </div>

            <!-- Authenticated Users (Logged In) -->
            <div class="d-flex align-items-center gap-2" sec:authorize="isAuthenticated()">
                <!-- Notification Bell for Candidates -->
                <span sec:authorize="hasRole('CANDIDATE')">
                    <a th:href="@{/candidate/notifications}" class="btn btn-sm btn-outline-secondary position-relative me-1" title="Notifications">
                        <i class="bi bi-bell-fill"></i>
                        <span th:if="${unreadNotificationCount > 0}" 
                              class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                              style="font-size: 0.65rem;"
                              th:text="${unreadNotificationCount}">1</span>
                    </a>
                </span>

                <!-- User Email Badge -->
                <span class="badge bg-light text-dark border py-2 px-3">
                    <i class="bi bi-person-circle text-primary me-1"></i>
                    <span sec:authentication="name">User</span>
                </span>

                <!-- HR Specific Links -->
                <span sec:authorize="hasRole('HR')">
                    <a th:href="@{/hr/dashboard}" class="btn btn-sm btn-outline-success">
                        <i class="bi bi-speedometer2 me-1"></i>HR Dashboard
                    </a>
                </span>

                <!-- Candidate Specific Links -->
                <span sec:authorize="hasRole('CANDIDATE')">
                    <a th:href="@{/candidate/dashboard}" class="btn btn-sm btn-outline-info">
                        <i class="bi bi-person-workspace me-1"></i>My Profile
                    </a>
                </span>

                <!-- Admin Specific Links -->
                <span sec:authorize="hasRole('ADMIN')">
                    <a th:href="@{/admin/dashboard}" class="btn btn-sm btn-outline-warning">
                        <i class="bi bi-shield-shaded me-1"></i>Admin
                    </a>
                </span>

                <!-- Logout Button -->
                <form th:action="@{/logout}" method="post" class="d-inline mb-0">
                    <button type="submit" class="btn btn-outline-danger btn-sm">
                        <i class="bi bi-box-arrow-right me-1"></i>Logout
                    </button>
                </form>
            </div>
        </div>
    </div>
</nav>

</body>
</html>
